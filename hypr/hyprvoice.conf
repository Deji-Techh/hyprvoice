# hyprvoice — audio-notch voice-to-text
# Toggle (press to start, press again to stop → transcribe → paste):
bind = SUPER, R, exec, $HOME/.local/bin/hyprvoice toggle
# Pill overlay (always on top, top-center) + typing daemon.
# Autostart is handled ONLY by the hyprvoice-pill.service user unit (see
# systemd/) — no exec-once here, so a reboot can never spawn a second
# pill (two instances fight over the quickshell lock and double-fire
# toggles: one click = start + instant stop).
exec-once = systemctl --user start ydotool.service
